<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>estilizando tabelas</title>
</head>
<body>
    <h2>estilizando tabelas</h2>
    <table>
        <tr>
            <th>Código</th>
            <th>Produto</th>
            <th>Preços</th>
        </tr>
        <tr>
            <td>001</td>
            <td>Notbook</td>
            <td class="notas">2.500</td>
        </tr>
        <tr  class="alterna">
            <td>002</td>
            <td>Celular</td>
            <td class="notas">3.500</td>
        </tr>
        <tr>
            <td>003</td>
            <td>Tv</td>
            <td class="notas">4.500</td>
        </tr>
        <tr  class="alterna">
            <td>004</td>
            <td>Cama</td>
            <td class="notas">1.000</td>
        </tr>
    </table>
</body>
</html>
