<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Estilizando formulários</title>
</head>
<body>
    <h2>Estilizando formulários</h2>
    <form >
        
        <fieldset>
            <legend>Detalhes de contatos</legend>

            <div>
                <label for="nome">Nome:
                <input type="text" name="nome" id="nome"></label>
            </div>
            <div>
                <label for="email">Email:
                <input type="text" name="nome" id="nome"></label>
            </div>
            <div>
                <label for="url">URL:
                <input type="text" name="url" id="url"></label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Comentários</legend>
            <div>
                <label for="mensagem">Mensagem</label>
                <textarea name="Mensagem" id="Mensagem"></textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>Lembrar de mim</legend>
            <div>
                <label for="">
                    <input class="radio" type="radio" name="lembrar" id="sim">Sim
                </label>
            </div>
            <div>
                <label >
                    <input class="radio" type="radio" name="lembrar" id="nao">Não
                </label>
            </div>
        </fieldset>
    </form>
</body>
</html>
