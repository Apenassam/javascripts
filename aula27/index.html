<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .estilo1{
            background-color: #ff0000;
            color: white;
        }
        .estilo2{
            width: 400px;
            height: 50px;
            background-color: #ff0000;
            text-align: center;
            font-size: 25px;
            color: white;
            padding: 25px;
        }
    </style>
</head>
<body>
    <script>
        function modificandoClasse(){
            document.getElementById('mensagem').className = 'estilo2'
        }
    </script>

    <div class="estilo1" id="mensagem">Modificando a classe do elemento</div>
<hr>
    <button type="button" onclick="modificandoClasse()">Aplicar Classe</button>

  
</body>
</html>
